<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Ikon Tab Browser (Favicon) -->
    <!-- Jika Anda menggunakan logo berformat PNG, ubah href di bawah menjadi href="/logo.png" -->
    <link rel="icon" type="image/svg+xml" href="/enka-favicon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Meta Utama untuk Mesin Pencari (Google Search) -->
    <title>Enka Imron Mandiri | Travel Umroh, Domestik & Internasional</title>
    <meta name="description" content="Biro perjalanan Umroh, Tour Wisata Domestik, dan Internasional terpercaya. Dapatkan paket perjalanan ibadah dan liburan terbaik dengan harga bersahabat dan pelayanan prima." />

    <!-- Memberi instruksi kepada robot Google untuk mengindeks halaman ini -->
    <meta name="robots" content="index, follow" />

    <!-- Meta Open Graph (Untuk Tampilan Preview Kotak saat Link Dibagikan di WhatsApp/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Enka Imron Mandiri | Travel Umroh & Wisata" />
    <meta property="og:description" content="Melayani perjalanan ibadah Umroh dan liburan ke berbagai destinasi Domestik maupun Internasional dengan amanah." />

    <meta property="og:site_name" content="Enka Imron Mandiri" />
    
    <!-- Ganti logo.png di bawah dengan nama file logo Anda jika berbeda (wajib ada di dalam folder public) -->
    <meta property="og:image" content="https://www.enkaimronmandiri.com/enka-favicon.png" />
  </head>
